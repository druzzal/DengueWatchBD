name: Ingest DGHS dengue data

# 11:30 UTC is 17:30 in Dhaka (UTC+6). GitHub Actions cron is always UTC, and
# scheduled runs can start late under load, so nothing downstream should assume
# an exact minute.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Reporting date to ingest (YYYY-MM-DD). Defaults to today in Dhaka."
        required: false
      dry_run:
        description: "Parse and validate without writing to Supabase"
        type: boolean
        default: false

concurrency:
  # Two runs writing the same reporting day would race on the upsert.
  group: ingest-dghs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-dghs-dengue-data:
    name: update-dghs-dengue-data
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install pytest

      # Tests run before the ingestion, not after: a parser that cannot pass
      # its own suite has no business writing to the database.
      - name: Run tests
        run: |
          python -m pytest server/tests scraper -q

      - name: Ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$INPUT_DATE" ]; then ARGS="$ARGS --date $INPUT_DATE"; fi
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python scraper/scraper.py $ARGS

      # A surge is written to disk rather than pushed from here: this job holds
      # no APNs key, and a data pipeline that can also message every user has a
      # larger blast radius than it needs.
      - name: Upload surge alert
        if: success() && hashFiles('surge-alert.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: surge-alert
          path: surge-alert.json
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "No ALERT_WEBHOOK_URL secret set — skipping notification."
            exit 0
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Discord's field is "content"; Telegram's sendMessage uses "text".
          # Sending both means one webhook shape works without another secret.
          python - <<'EOF'
          import json, os, urllib.request
          message = (
              "DengueWatch: DGHS ingestion failed.\n"
              f"{os.environ['RUN_URL']}"
          )
          body = json.dumps({"content": message, "text": message}).encode()
          request = urllib.request.Request(
              os.environ["WEBHOOK"], data=body,
              headers={"Content-Type": "application/json"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("notified:", response.status)
          except Exception as exc:
              # Never let the notifier mask the real failure.
              print("could not notify:", exc)
          EOF
        continue-on-error: true
