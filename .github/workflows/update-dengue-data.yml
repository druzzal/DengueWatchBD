name: Update dengue data

# DGHS publishes the previous day's figures during the working day in Dhaka,
# not first thing. A single 09:00 Dhaka run scraped a source that had not
# updated yet, so the published payload sat a day behind more or less
# permanently — the 5 Sep run found nothing newer than 3 Sep, while the same
# parser against the same URL returned 4 Sep by midday.
#
# Two passes rather than one moved later, because the early figure is not
# final: DGHS revises its numbers after publishing (the ingestion log counts
# 15 downward revisions), and the day 4 Sep first appeared it read 512 against
# a neighbouring average near 1,200. The afternoon pass catches the day; the
# next morning's pass re-reads it, and RETRY_RECENT_DAYS = 3 lets a corrected
# figure overwrite the provisional one.
#
# 03:00 UTC = 09:00 Dhaka. 12:00 UTC = 18:00 Dhaka.
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First day to include (YYYY-MM-DD). Defaults to 1 January."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Downloaded PDFs are immutable once published, so caching them means a
      # daily run fetches one file rather than a season's worth.
      - name: Restore PDF cache
        uses: actions/cache@v4
        with:
          path: server/.cache
          key: dghs-pdfs-${{ github.run_id }}
          restore-keys: dghs-pdfs-

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build dataset
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          python -m dghs.cli \
            --start "${START:-$(date -u +%Y)-01-01}" \
            --out ../public/surveillance.json

      # The CLI exits non-zero and writes nothing if any check fails, so
      # reaching this step means the dataset reconciled. It also writes
      # status.json and ingestion-runs.json beside the dataset.
      - name: Report ingestion status
        if: always()
        run: |
          if [ -f ../public/status.json ]; then
            echo "### DGHS ingestion" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ../public/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No status written — the run failed before producing a dataset." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit if changed
        run: |
          cd ..
          # The dataset itself decides, not git. The run log gains an entry on
          # every run, so asking git whether anything under public/ differs was
          # always true and every run committed — including runs where DGHS had
          # published nothing new. The pipeline compares a sha256 of the data
          # (excluding ingestion timestamps) and skips the write entirely when
          # it matches, so an unchanged surveillance.json here means no change.
          if git diff --quiet -- public/surveillance.json; then
            echo "DGHS published nothing new — recording the run, leaving the dataset untouched."
            git config user.name "dengue-data-bot"
            git config user.email "bot@users.noreply.github.com"
            git add -A public/
            git diff --cached --quiet || git commit -m "Record ingestion run $(date -u +%Y-%m-%d)"
            git push || true
            exit 0
          fi
          git config user.name "dengue-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A public/
          git commit -m "Update dengue data $(date -u +%Y-%m-%d)"
          git push
