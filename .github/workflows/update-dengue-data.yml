name: Update dengue data

# DGHS publishes the previous day's press release each morning Dhaka time.
# 03:00 UTC is 09:00 in Dhaka.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First day to include (YYYY-MM-DD). Defaults to 1 January."
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Downloaded PDFs are immutable once published, so caching them means a
      # daily run fetches one file rather than a season's worth.
      - name: Restore PDF cache
        uses: actions/cache@v4
        with:
          path: server/.cache
          key: dghs-pdfs-${{ github.run_id }}
          restore-keys: dghs-pdfs-

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Build dataset
        env:
          START: ${{ github.event.inputs.start }}
        run: |
          python -m dghs.cli \
            --start "${START:-$(date -u +%Y)-01-01}" \
            --out ../public/surveillance.json

      # The CLI exits non-zero and writes nothing if any check fails, so
      # reaching this step means the dataset reconciled. It also writes
      # status.json and ingestion-runs.json beside the dataset.
      - name: Report ingestion status
        if: always()
        run: |
          if [ -f ../public/status.json ]; then
            echo "### DGHS ingestion" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ../public/status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No status written — the run failed before producing a dataset." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit if changed
        run: |
          cd ..
          if git diff --quiet -- public/; then
            echo "DGHS published nothing new — leaving the dataset untouched."
            exit 0
          fi
          git config user.name "dengue-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/surveillance.json public/status.json public/ingestion-runs.json
          git commit -m "Update dengue data $(date -u +%Y-%m-%d)"
          git push
