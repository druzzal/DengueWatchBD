name: Scrape DGHS dengue data

# 11:30 UTC is 17:30 in Dhaka (UTC+6). GitHub Actions cron is always UTC, and
# scheduled runs can start late under load — nothing downstream should depend
# on the exact minute.
on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scrape and validate without writing to Supabase"
        type: boolean
        default: false

concurrency:
  # Two runs upserting the same report_date would race.
  group: scrape-dghs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrape and upsert
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python scraper/scrape_dghs.py --dry-run
          else
            python scraper/scrape_dghs.py
          fi

      # The script exits non-zero on any parse or write failure, so the job
      # goes red rather than quietly succeeding with nothing written.
      - name: Report failure
        if: failure()
        run: |
          echo "### DGHS scrape failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The dashboard layout may have changed. Run the workflow with" >> "$GITHUB_STEP_SUMMARY"
          echo "dry_run enabled to see the parser output without writing." >> "$GITHUB_STEP_SUMMARY"
